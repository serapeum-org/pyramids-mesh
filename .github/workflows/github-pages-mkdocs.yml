name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

jobs:
  # Gate every deploy on a warnings-as-errors build, and -- on a pull request -- build the
  # site WITHOUT publishing it. The old `deploy-pr` job committed a full site build to the
  # shared `gh-pages` branch on every PR; nothing pruned it, so the branch grew without
  # bound (earthlens reached 9.7 GB, at which point GitHub Pages stopped building at all and
  # the current release's docs were silently never published -- issue #81). `mkdocs build
  # --strict` is the real PR gate (a broken nav entry or malformed docstring fails the run),
  # and reviewers download the rendered site from the artifact instead of a published preview.
  build-strict:
    runs-on: ubuntu-latest
    # Reads the tree only; the write scopes the workflow grants are for the deploy jobs, so a
    # PR has no path to gh-pages at all.
    permissions:
      contents: read
      # download the release-ref artifact on the workflow_run path (cross-run)
      actions: read
    steps:
      - name: Download the release ref from the github-release run
        # Gate the SAME tree the deploy jobs publish: on workflow_run / release that is the release branch / tag
        # (the bump + new changelog), not pre-bump main -- else a page that only exists on the release branch
        # would pass --strict yet still publish. On push / pull_request this is skipped and checkout uses its
        # default ref (the PR merge commit), so fork-controlled code never reaches a write-scoped job.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ref
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .release-ref

      - name: Resolve the ref to gate
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              REF="$(cat .release-ref/release-ref.txt)"
              [ -n "$REF" ] || { echo "::error::empty release ref"; exit 1; } ;;
            release) REF="$RELEASE_REF" ;;
            *) REF="" ;;
          esac
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.ref.outputs.ref }}

      # serapeum-org/github-actions is a monorepo pinned by commit SHA (the tag is in the trailing
      # comment). 71653ea9 is the dereferenced commit for pixi/v1.3.0, shared with mkdocs/v2.0.0,
      # so the --strict gate and the deploy jobs share one pixi setup rather than drifting. Verify
      # with: git ls-remote --tags https://github.com/serapeum-org/github-actions
      - uses: serapeum-org/github-actions/actions/python-setup/pixi@71653ea9fc52dff9166b270614a41d7e42b3453a # pixi/v1.3.0
        with:
          environments: docs
          activate-environment: docs
          cache: true
          version: v0.73.0

      - name: Build docs with --strict
        run: pixi run -e docs mkdocs build --strict --site-dir /tmp/site

      # A pull request builds the site but no longer publishes it (#81): reviewers who want
      # the rendered pages download them from here instead of a gh-pages preview.
      - name: Upload the built site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-pr-${{ github.event.pull_request.number }}
          path: /tmp/site
          retention-days: 7

  # deploy-main / deploy-release run un-serialised on purpose: mkdocs-deploy retries the
  # shared gh-pages push (mike_push.sh), so each completes. Never add workflow-level
  # concurrency here -- it would also evict the build-strict gate.
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        # mkdocs/v2.0.0 dropped the deploy-token input: mike_push.sh now pushes gh-pages with the
        # checkout's persisted credentials. Persist ACTIONS_DEPLOY_TOKEN (not the default
        # GITHUB_TOKEN, which may be blocked from gh-pages and whose pushes do not rebuild Pages).
        token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@71653ea9fc52dff9166b270614a41d7e42b3453a # mkdocs/v2.0.0
      with:
        trigger: 'main'
        package-manager: 'pixi'
        package-manager-version: v0.73.0
        install-groups: 'docs'

  deploy-release:
    # Security: when triggered via `workflow_run`, require that the upstream
    # workflow ran from the base repository (not a fork) so we can never run
    # untrusted code in a context that holds `ACTIONS_DEPLOY_TOKEN`.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_repository.fork == false)
    needs: build-strict
    runs-on: ubuntu-latest
    # Collapse a double-fire: the workflow triggers on both `release: published` and the
    # github-release `workflow_run`, and a release that does both would start two
    # deploy-release runs that each now also prune, contending on gh-pages. The group must
    # be a CONSTANT, not keyed on the event payload: the `release` event carries the tag
    # while the `workflow_run` event does not (its `github.ref` is `refs/heads/main`), so
    # any version-derived key evaluates differently on the two triggers and would NOT
    # collapse them. A constant group serialises every release deploy -- which is what we
    # want anyway, since they all push the shared gh-pages branch. JOB-scoped, so it never
    # evicts the build-strict gate the way a WORKFLOW-level group would (see the
    # deploy-main/deploy-release comment above). Queue rather than cancel so the first
    # deploy+prune finishes before the duplicate runs (the prune is idempotent, floored on
    # main + the released version + the five newest releases).
    concurrency:
      group: deploy-release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      # Download the release-ref artifact from the github-release run (cross-run fetch).
      actions: read
    steps:
    - name: Download the release ref from the github-release run
      # github-release cuts the version bump + tag on the release branch, not on the dispatch ref, so on the
      # workflow_run path head_sha/head_branch point at pre-bump main. Fetch the released commit SHA it
      # recorded and deploy from there, so the versioned docs reflect the released version -- the same
      # release-ref handoff pypi-release uses. (Without it, deploy-release publishes OLD docs + regresses
      # `latest`.)
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-ref
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: .release-ref

    - name: Resolve the ref to deploy
      id: ref
      env:
        EVENT_NAME: ${{ github.event_name }}
        # Fallback serves the `release` event, where github.ref is refs/tags/<tag> (the released tag).
        FALLBACK_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "workflow_run" ]; then
          REF="$(cat .release-ref/release-ref.txt)"
          [ -n "$REF" ] || { echo "::error::empty release ref"; exit 1; }
        else
          REF="$FALLBACK_REF"
        fi
        echo "resolved ref: ${REF}"
        echo "ref=${REF}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        # workflow_run: the released commit SHA from the release-ref artifact (the tree that holds the bump);
        # `release` event: the published tag. Both carry the released version. The release-ref SHA comes from
        # the gated, fork-guarded release run, so it is trusted input; the fork guard in `if:` above keeps
        # untrusted code out.
        ref: ${{ steps.ref.outputs.ref }}
        # Persist ACTIONS_DEPLOY_TOKEN (not the default GITHUB_TOKEN) so BOTH the deploy
        # (mkdocs/v2.0.0 dropped deploy-token -- mike_push.sh pushes with these persisted
        # credentials) and the prune step's `mike delete --push` authenticate to gh-pages with the
        # SAME credential. The default token may be blocked from pushing to gh-pages (and its
        # pushes do not trigger a Pages rebuild), so falling back to it would fail the job.
        token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        echo "tag=$VERSION" >> $GITHUB_OUTPUT

    # The same pixi + docs env the deploy and the prune below both need; `mike`
    # (invoked via `pixi run -e docs`) comes from the docs feature.
    - uses: serapeum-org/github-actions/actions/python-setup/pixi@71653ea9fc52dff9166b270614a41d7e42b3453a # pixi/v1.3.0
      with:
        environments: docs
        activate-environment: docs
        cache: true
        version: v0.73.0

    # mkdocs/v2.0.0 dropped the deploy-token input; mike_push.sh pushes gh-pages with the
    # credentials the checkout above persisted (ACTIONS_DEPLOY_TOKEN), the same token the prune
    # step below reuses.
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@71653ea9fc52dff9166b270614a41d7e42b3453a # mkdocs/v2.0.0
      with:
        trigger: 'release'
        package-manager: 'pixi'
        package-manager-version: v0.73.0
        install-groups: "docs"
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'

    # Retain `main` plus the RETAIN_RELEASES most recent releases and delete anything else,
    # so version directories stop accumulating (#81). Each directory is a full site copy, so
    # keeping every release is what took earthlens's gh-pages to 9.7 GB and broke Pages; five
    # releases plus main sits well below that. `main` is always kept -- deploy-main
    # republishes it on every push -- and the just-released KEEP_VERSION is pinned as a floor.
    # Auth comes from the checkout above, which persists ACTIONS_DEPLOY_TOKEN -- the same
    # credential the deploy's push uses -- so the `mike delete --push` here is not weaker
    # than the deploy it follows. `mike` is run through `pixi run -e docs` so it resolves
    # from the env set up above.
    - name: Prune superseded documentation versions
      env:
        KEEP_VERSION: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        RETAIN_RELEASES: '5'
      run: |
        if [ -z "$KEEP_VERSION" ]; then
          echo "::error::no release version resolved; refusing to prune"
          exit 1
        fi
        # Re-sync, recompute and retry as a unit: a concurrent main deploy moves
        # gh-pages, which makes mike's fast-forward push lose the race, and the
        # stale list computed against the old tip must not be reused.
        for attempt in 1 2 3; do
          # The re-sync is part of the retried unit: GitHub runs this with `-eo pipefail`,
          # so a transient `git fetch` or `mike list` would otherwise abort the whole step
          # before the retry it exists for. Guard them and `continue` instead. `mike list`
          # writes to a file first so its failure is caught here rather than swallowed by
          # the `| awk` pipe.
          if ! git fetch origin gh-pages \
            || ! git branch -f gh-pages FETCH_HEAD \
            || ! pixi run -e docs mike list > /tmp/mike-list-raw; then
            echo "::warning::prune re-sync failed (attempt ${attempt}/3); retrying"
            sleep $(( attempt * 3 ))
            continue
          fi

          awk '{print $1}' /tmp/mike-list-raw | sort -u > /tmp/mike-all
          # `sort -V` is load-bearing: a lexical sort ranks 0.9.0 above 0.11.0 and
          # would retain the wrong five. Only X.Y.Z entries count as releases, so an
          # alias-only row falls through to the delete set rather than consuming a slot.
          grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' /tmp/mike-all \
            | sort -rV | head -n "$RETAIN_RELEASES" > /tmp/mike-keep-releases
          # KEEP_VERSION is listed explicitly as a floor: the release just deployed
          # must survive even if it somehow sorts outside the top RETAIN_RELEASES.
          { echo main; echo "$KEEP_VERSION"; cat /tmp/mike-keep-releases; } \
            | grep -v '^$' | sort -u > /tmp/mike-keep
          stale=$(comm -23 /tmp/mike-all /tmp/mike-keep | tr '\n' ' ')

          if [ -z "$stale" ]; then
            echo "nothing to prune; retaining $(tr '\n' ' ' < /tmp/mike-keep)"
            exit 0
          fi
          echo "retaining $(tr '\n' ' ' < /tmp/mike-keep)"
          echo "deleting: $stale"
          if pixi run -e docs mike delete --push $stale; then
            exit 0
          fi
          echo "::warning::prune lost a gh-pages push race (attempt ${attempt}/3); retrying"
          sleep $(( attempt * 3 ))
        done
        echo "::error::could not prune superseded documentation versions after 3 attempts"
        exit 1
