fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        name: "[py -  check] validate yaml"
        # Committed sample files under tests/data and examples/data are byte-faithful
        # real data (an Esri TIN's prj.adf is text and would otherwise gain a trailing
        # newline; MODFLOW .grb is binary); never rewrite them.
        exclude: ^(tests|examples)/data/
      - id: trailing-whitespace
        name: "[file - format] trim trailing whitespace"
        args: [ --markdown-linebreak-ext=md ]
        exclude: ^(tests|examples)/data/
      - id: check-added-large-files
        name: "[file -  check] large file"
        args: [ --maxkb=5000 ]
      - id: check-docstring-first
        name: "[py   -  check] docstring first"
        files: /examples
        types : [file, python ]
      - id: check-json
        name: "[json -  check] validate json"
      - id: check-merge-conflict
        name: "[git  -  check] merge conflict"
      - id: debug-statements
        name: "[py   -  check] debug statements"
      - id: detect-private-key
        name: "[cred -  check] private keys"
      - id: fix-encoding-pragma
        name: "[file - format] coding pragma"
        args: [ --remove ]
      - id: mixed-line-ending
        name: "[file - format] mixed line ending"
        args: [ --fix=auto ]
        exclude: ^(tests|examples)/data/
      - id: pretty-format-json
        name: "[json - format] pretty json"
        args: [ --autofix,
                --indent=4,
                --no-sort-keys ]
        # Jupyter notebooks are JSON but their on-disk format is owned by
        # nbformat/jupyter (indent=1); never let the JSON pretty-printer reindent
        # them. check-json still validates them.
        exclude: \.ipynb$
      - id: requirements-txt-fixer
        name: "[reqs - format] fix requirements.txt"
      - id: check-yaml
        name: "[yaml -  check] validate yaml"
        # --unsafe checks syntax only, without constructing the document.
        # `mkdocs.yml` carries `!!python/name:` tags (the Material emoji index and
        # the superfences mermaid formatter), which a safe load refuses to
        # construct — without this the hook fails on every run, and `fail_fast`
        # then stops the rest of them.
        args: [ --unsafe ]

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: "[py   - check] pydocstyle"
        # The src-layout path, not a bare package path: the package lives at
        # `src/pyramids_mesh/`, so a `^pyramids_mesh/` pattern matches nothing
        # and the hook silently passes on every file.
        files: ^src/pyramids_mesh/

  # ruff replaces flake8 (lint), black (format) and isort in one tool. ruff-check --fix
  # applies autofixable lint (E/F/W) and import sorting (I); ruff-format reformats. Keep
  # `rev` in step with the `ruff==` pin in pyproject.toml's dev group. Rule selection,
  # ignores and per-file-ignores live in [tool.ruff.lint]; the `# isort:skip` guards on
  # the `import pyramids` lines are honoured, so the import-order contract is preserved.
  #
  # The example notebooks under docs/examples/ are excluded from both ruff hooks: they are
  # hand-authored teaching material, not shipped src, and flake8 historically excluded
  # example code from linting (see [tool.ruff.lint.per-file-ignores]). ruff discovers
  # .ipynb only when pre-commit passes the paths, so this keeps the lint/format surface on
  # src/ and lets the notebooks keep their pedagogical import order and cell layout.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        name: "[py   -   lint] ruff"
        args: [--fix]
        exclude: ^docs/examples/.*\.ipynb$
      - id: ruff-format
        name: "[py   - format] ruff-format"
        exclude: ^docs/examples/.*\.ipynb$

  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.2.1
    hooks:
      - id: beautysh
        name: "[bash - format] beautysh"

  # pre-commit-shell: Checks shell scripts against shellcheck.
  - repo: https://github.com/detailyang/pre-commit-shell
    rev: 1.0.5
    hooks:
      - id: shell-lint
        name: "[bash -   lint] shell-lint"

  - repo: https://github.com/rlindsgaard/pre-commit-commit-msg-hooks
    rev: 0.1.0
    hooks:
      - id: check-description-max-length
        name: "[bash -   format] check-description-max-length"
      - id: check-second-line-empty
        name: "[bash -   format] check-second-line-empty"
      - id: check-summary-capitalized
        name: "[bash -   format] check-summary-capitalized"
      - id: check-summary-imperative
        name: "[bash -   format] check-summary-imperative"
      - id: check-summary-max-length
        name: "[bash -   format] check-summary-max-length"
      - id: check-summary-punctuation
        name: "[bash -   format] check-summary-punctuation"

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pytest -v --cov=src/pyramids_mesh --cov-report=term-missing -m "not vendor_data"
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: doctest
        name: doctest
        entry: python -c "import matplotlib; matplotlib.use('Agg'); import pytest; import sys; sys.exit(pytest.main(['--doctest-modules', 'src']))"
        language: system
        always_run: true
        pass_filenames: true

  - repo: local
    hooks:
      - id: notebook-check
        name: nbval
        entry: pytest --nbval --nbval-lax --verbose
        language: system
        files: .*\.ipynb$
        always_run: true
