site_name: pyramids-mesh
site_description: "Mesh file-format drivers for pyramids: 2DM, Selafin, DFSU, XMDF, PLY and more"
site_url: https://serapeum-org.github.io/pyramids-mesh/
repo_url: https://github.com/serapeum-org/pyramids-mesh
repo_name: serapeum-org/pyramids-mesh

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference
  primary: indigo
  accent: indigo
  icon:
    repo: fontawesome/brands/github


plugins:
  - search
  - mkdocs-jupyter:
      execute: false  # notebooks are pre-executed; render the stored outputs
      include_source: true
      ignore: ["**/.ipynb_checkpoints/**"]
  - panzoom:
      hint_location: "top"
      key: "ctrl"
      full_screen: true
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            # Mesh types are assembled from mixins in this stack, so most methods
            # are defined on a base class rather than on the class itself.
            # mkdocstrings defaults this to false, which silently drops them.
            inherited_members: true
  - table-reader
  - tags
  - mike:
      # These fields are all optional; the defaults are as below...
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 1-4
      anchorlink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
  - Reference:
    - Overview: reference/index.md
    - 2DM (SMS/TUFLOW): reference/2dm.md
    - DAT (SMS results): reference/dat.md
    - Mike21 (DHI mesh): reference/mike21.md
    - Selafin (TELEMAC): reference/selafin.md
    - SWW (ANUGA): reference/sww.md
    - XMDF (HDF5 results): reference/xmdf.md
    - 3Di (results): reference/3di.md
    - TUFLOW FV (results): reference/tuflowfv.md
    - DFSU (DHI MIKE): reference/dfsu.md
    - Esri TIN (directory): reference/esri-tin.md
    - PLY (Stanford): reference/ply.md
    - XMS TIN: reference/xmstin.md
  - About:
    - Change-log: change-log.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Contributing: contributing.md
    - License: LICENSE.md
    - Authors: AUTHORS.md
    - ADRs:
        - Index: adr/index.md
        - ADR-0001 Docs stack: adr/0001-docs-stack.md
        - ADR-0002 Type checking: adr/0002-type-checking.md
        - ADR-0003 Scope boundary (superseded): adr/0003-scope-boundary.md
        - ADR-0004 Versioned docs: adr/0004-versioning-docs.md
        - ADR-0005 File-format drivers: adr/0005-file-format-drivers.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/serapeum-org/pyramids-mesh
  version:
      provider: mike
  version_selector: true
