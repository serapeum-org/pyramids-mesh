site_name: pyramids-mesh
site_description: "Mesh file-format drivers for pyramids: 2DM, Selafin, DFSU, XMDF, PLY and more"
site_url: https://serapeum-org.github.io/pyramids-mesh/
repo_url: https://github.com/serapeum-org/pyramids-mesh
repo_name: serapeum-org/pyramids-mesh

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference
  primary: indigo
  accent: indigo
  icon:
    repo: fontawesome/brands/github


plugins:
  - search
  - mkdocs-jupyter:
      execute: false  # notebooks are pre-executed; render the stored outputs
      include_source: true
      ignore: ["**/.ipynb_checkpoints/**"]
  - panzoom:
      hint_location: "top"
      key: "ctrl"
      full_screen: true
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            # Mesh types are assembled from mixins in this stack, so most methods
            # are defined on a base class rather than on the class itself.
            # mkdocstrings defaults this to false, which silently drops them.
            inherited_members: true
  - table-reader
  - tags
  - mike:
      # These fields are all optional; the defaults are as below...
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 1-4
      anchorlink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
  - Reference:
    - Overview: reference/index.md
    - Supported formats: reference/supported-formats.md
    - coastal_ocean:
      - ADCIRC: reference/coastal_ocean/adcirc.md
      - SCHISM (.gr3): reference/coastal_ocean/schism.md
      - FVCOM (native grid): reference/coastal_ocean/fvcom.md
      - Selafin (TELEMAC): reference/coastal_ocean/selafin.md
      - SWW (ANUGA): reference/coastal_ocean/sww.md
      - TUFLOW FV (results): reference/coastal_ocean/tuflowfv.md
      - DFSU (DHI MIKE): reference/coastal_ocean/dfsu.md
      - Mike21 (DHI mesh): reference/coastal_ocean/mike21.md
    - river_flood:
      - 3Di (urban/rural flood): reference/river_flood/3di.md
      - HEC-RAS 2D: reference/river_flood/hecras.md
      - FLO-2D (flood): reference/river_flood/flo2d.md
      - RiverFlow2D (.fed): reference/river_flood/riverflow2d.md
      - SRH-2D: reference/river_flood/srh2d.md
      - 2DM (SMS/TUFLOW): reference/river_flood/2dm.md
      - DAT (SMS results): reference/river_flood/dat.md
      - XMDF (HDF5 results): reference/river_flood/xmdf.md
      - Delft3D FM / D-HYDRO 1D: reference/river_flood/delft3d-1d.md
      - GiD / Iber (.msh): reference/river_flood/gid.md
    - earth_system:
      - MPAS (NetCDF): reference/earth_system/mpas.md
      - ICON (NetCDF): reference/earth_system/icon.md
      - GEOS cubed-sphere: reference/earth_system/geos.md
      - ESMF mesh: reference/earth_system/esmf.md
      - SCRIP grid: reference/earth_system/scrip.md
    - subsurface:
      - MODFLOW 6 DISV: reference/subsurface/modflow6.md
      - MODFLOW 6 DISU: reference/subsurface/modflow6-disu.md
      - FEFLOW (.fem): reference/subsurface/feflow.md
    - finite_element:
      - Abaqus (.inp): reference/finite_element/abaqus.md
      - Nastran bulk data: reference/finite_element/nastran.md
      - Kratos MDPA: reference/finite_element/kratos.md
      - FLAC3D (.f3grid): reference/finite_element/flac3d.md
      - MED (.med): reference/finite_element/med.md
      - Exodus II (.exo): reference/finite_element/exodus.md
      - AVS-UCD: reference/finite_element/avs-ucd.md
    - cfd:
      - SU2 (.su2): reference/cfd/su2.md
      - OpenFOAM polyMesh: reference/cfd/openfoam.md
      - CGNS (.cgns): reference/cfd/cgns.md
      - XDMF (XML+HDF5): reference/cfd/xdmf.md
      - Tecplot FE: reference/cfd/tecplot.md
    - mesh_generators:
      - Gmsh (.msh): reference/mesh_generators/gmsh.md
      - Netgen (.vol): reference/mesh_generators/netgen.md
      - Triangle / TetGen: reference/mesh_generators/triangle.md
      - SWAN Easymesh: reference/mesh_generators/easymesh.md
      - Medit (.mesh): reference/mesh_generators/medit.md
    - geometry:
      - VTK / VTU: reference/geometry/vtk.md
      - Wavefront OBJ: reference/geometry/obj.md
      - STL: reference/geometry/stl.md
      - OFF (Object File Format): reference/geometry/off.md
      - PLY (Stanford): reference/geometry/ply.md
      - XMS TIN: reference/geometry/xms-tin.md
      - Esri TIN (directory): reference/geometry/arcgis-tin.md
  - About:
    - Change-log: change-log.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Contributing: contributing.md
    - License: LICENSE.md
    - Authors: AUTHORS.md
    - ADRs:
        - Index: adr/index.md
        - ADR-0001 Docs stack: adr/0001-docs-stack.md
        - ADR-0002 Type checking: adr/0002-type-checking.md
        - ADR-0003 Scope boundary (superseded): adr/0003-scope-boundary.md
        - ADR-0004 Versioned docs: adr/0004-versioning-docs.md
        - ADR-0005 File-format drivers: adr/0005-file-format-drivers.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/serapeum-org/pyramids-mesh
  version:
      provider: mike
  version_selector: true
