[project]
name = "pyramids-mesh"
version = "0.6.0"
description = "Mesh file-format drivers for pyramids: 2DM, Selafin, DFSU, XMDF, PLY and more"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "mesh", "UGRID", "unstructured grid", "pyramids"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is deliberately absent. It is not a dependency of this package: the
# `pyramids-core` wheel vendors its own osgeo bindings and `import pyramids` is
# what puts them on `sys.path` (activate_vendored_osgeo). Nothing here installs
# or pins a separate GDAL.
dependencies = [
    # `pyramids-gis` was renamed to `pyramids-core` in 0.70.0; the import stays
    # `pyramids`. The floor is 0.77.0: 0.75.0 renamed the mesh data model
    # (`UgridDataset`/`Network1d` -> `MeshDataset`/`Mesh1d`, which this package now
    # imports), 0.76.0 consolidated the netcdf selection surface (one sel/isel surface
    # plus the `*_names` accessors), and 0.77.0 renamed more netcdf members (e.g.
    # `MeshDataset.get_data` -> subscription `mesh[name]`, which the notebooks now use)
    # and fixed the xarray-interop install hint. The example notebooks are built and
    # validated against 0.77.0, so the floor stays >= 0.77.0.
    "pyramids-core >=0.77.0",
    "numpy >=2.0.0",
]
# scipy, shapely and geopandas are deliberately NOT declared yet. The UGRID
# subsystem requires all three, so they arrive with `pyramids-core` — but that is
# its requirement, not a promise to this package. Declare each one here the
# moment a module under `src/pyramids_mesh/` imports it directly; inheriting a
# peer's transitive dependency is what breaks when that peer reshuffles its own
# requirements.

[project.optional-dependencies]
# No `viz` extra. A driver returns data and the caller plots it, through pyramids
# and cleopatra — this package declares no plotting code and therefore no plotting
# dependency (ADR-0005).
#
# One extra per dependency-backed driver family. A driver whose extra is absent
# cannot import its backing library at driver-module import, so pyramids' registry
# skips it with a warning — a bare install stays small and every other driver keeps
# working.

# DHI MIKE: DFSU (unstructured) and DFS2 (structured grid). These proprietary binary
# containers cannot be parsed without DHI's own library; mikeio is the only portable
# route. It is the heaviest extra here: it pulls mikecore, pandas, matplotlib, scipy
# and tqdm.
dhi = ["mikeio >=3.0.0"]

all = ["pyramids-mesh[dhi]"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0",
    # ruff replaces black (format), flake8 (E/F/W lint) and isort (I) in one tool. Pinned
    # to the `.pre-commit-config.yaml` ruff-pre-commit rev so `pixi run -e dev ruff ...`
    # matches exactly what the hook and CI enforce — bump both together. pydocstyle stays:
    # ruff is not configured for docstring-style (D) rules, so it covers a distinct
    # concern and is not a duplicate of anything ruff does.
    "ruff==0.15.22",
    "pydocstyle==6.3.0",
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    # Layers on top of `dev`: every environment that enables the `notebook` feature also
    # enables `dev` (which already carries pip/jupyterlab/notebook/jupyter), so the only
    # thing the notebook runtime must add is the kernel. Re-listing the jupyter entries
    # here would just duplicate `dev` — exactly the kind of duplication this group avoids.
    "ipykernel",
    # The example notebooks render through cleopatra, which pyramids-core 0.75.0 moved
    # behind its `viz` extra (`cleopatra[tiles]>=0.44.0`, which pulls matplotlib and the
    # xyzservices / pyproj / Pillow basemap-tile stack). A bare `pyramids-mesh` install
    # pulls no plotting stack (ADR-0005), so the notebook runtime adds it here rather than
    # the package declaring a plotting dependency. This replaces the standalone
    # `xyzservices` pin — `cleopatra[tiles]` already carries it.
    "pyramids-core[viz]>=0.77.0",
]


# One entry point per driver. The value is a class, which pyramids' registry
# instantiates with no arguments; a class rather than a function because `can_open`
# matters -- several of these formats share `.dat`, `.mesh` and `.out`, so a suffix
# alone cannot identify one. A driver whose optional extra is missing raises at
# driver-module import and the registry skips it with a warning, which is why a bare
# install stays useful.
[project.entry-points."pyramids.mesh_drivers"]
2dm = "pyramids_mesh.drivers.sms:TwoDmDriver"
dat = "pyramids_mesh.drivers.sms:DatDriver"
mike21 = "pyramids_mesh.drivers.misc:Mike21Driver"
selafin = "pyramids_mesh.drivers.telemac:SelafinDriver"
sww = "pyramids_mesh.drivers.anuga:SwwDriver"
ply = "pyramids_mesh.drivers.interchange:PlyDriver"
xmstin = "pyramids_mesh.drivers.interchange:XmsTinDriver"
xmdf = "pyramids_mesh.drivers.xmdf:XmdfDriver"
3di = "pyramids_mesh.drivers.threedi:ThreeDiDriver"
tuflowfv = "pyramids_mesh.drivers.tuflowfv:TuflowFvDriver"
dfsu = "pyramids_mesh.drivers.dhi:DfsuDriver"
esri_tin = "pyramids_mesh.drivers.esri:EsriTinDriver"
xdmf = "pyramids_mesh.drivers.xdmf:XdmfDriver"
flo2d = "pyramids_mesh.drivers.flo2d:Flo2dDriver"
hecras = "pyramids_mesh.drivers.hecras:HecRasDriver"
adcirc = "pyramids_mesh.drivers.adcirc:AdcircDriver"
deltares1d = "pyramids_mesh.drivers.deltares:DeltaresNetworkDriver"
schism = "pyramids_mesh.drivers.schism:SchismDriver"
gmsh = "pyramids_mesh.drivers.gmsh:GmshDriver"
vtk = "pyramids_mesh.drivers.vtk:VtkDriver"
modflow6_disv = "pyramids_mesh.drivers.modflow:Modflow6DisvDriver"
mpas = "pyramids_mesh.drivers.mpas:MpasDriver"
icon = "pyramids_mesh.drivers.icon:IconDriver"
fvcom = "pyramids_mesh.drivers.fvcom:FvcomDriver"
triangle = "pyramids_mesh.drivers.triangle:TriangleDriver"
exodus = "pyramids_mesh.drivers.exodus:ExodusDriver"
su2 = "pyramids_mesh.drivers.su2:Su2Driver"
srh2d = "pyramids_mesh.drivers.srh2d:Srh2dDriver"
modflow6_disu = "pyramids_mesh.drivers.modflow:Modflow6DisuDriver"
feflow = "pyramids_mesh.drivers.feflow:FeflowDriver"
scrip = "pyramids_mesh.drivers.scrip:ScripDriver"
esmf = "pyramids_mesh.drivers.esmf:EsmfDriver"
geos = "pyramids_mesh.drivers.geos:GeosDriver"
cgns = "pyramids_mesh.drivers.cgns:CgnsDriver"
med = "pyramids_mesh.drivers.med:MedDriver"
nastran = "pyramids_mesh.drivers.nastran:NastranDriver"
abaqus = "pyramids_mesh.drivers.abaqus:AbaqusDriver"
avsucd = "pyramids_mesh.drivers.avsucd:AvsUcdDriver"
medit = "pyramids_mesh.drivers.medit:MeditDriver"
netgen = "pyramids_mesh.drivers.netgen:NetgenDriver"
tecplot = "pyramids_mesh.drivers.tecplot:TecplotDriver"
flac3d = "pyramids_mesh.drivers.flac3d:Flac3dDriver"
kratos = "pyramids_mesh.drivers.kratos:KratosDriver"
openfoam = "pyramids_mesh.drivers.openfoam:OpenFoamDriver"
obj = "pyramids_mesh.drivers.obj:ObjDriver"
stl = "pyramids_mesh.drivers.stl:StlDriver"
off = "pyramids_mesh.drivers.off:OffDriver"
gid = "pyramids_mesh.drivers.gid:GidDriver"


[project.urls]
homepage = "https://github.com/serapeum-org/pyramids-mesh"
repository = "https://github.com/serapeum-org/pyramids-mesh"
documentation = "https://serapeum-org.github.io/pyramids-mesh"
Changelog = "https://github.com/serapeum-org/pyramids-mesh/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids_mesh", "pyramids_mesh.*"]
# Belt and braces: `where = ["src"]` already means `tests/` cannot be picked up as a
# package, so this only states the intent for anyone reading the wheel contents.
exclude = ["tests*"]

# No sdist configuration here, and not for want of trying: setuptools offers no
# pyproject.toml equivalent of MANIFEST.in's `prune`, so sdist contents cannot be
# steered from this file. The default sdist carries `tests/*.py` and, importantly, does
# NOT carry `tests/data/*` -- so the binary format fixtures the PyPI-quota argument in
# ADR-0005 is about stay out of the distribution on their own. A handful of small test
# modules riding along costs nothing, so there is no MANIFEST.in.


[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]
# black ran with skip-string-normalization = true; `preserve` is its ruff equivalent, so
# existing quote styles are left untouched and the formatter switch produces no churn.
quote-style = "preserve"

[tool.ruff.lint]
# ruff's lint replaces flake8 (E/F/W) and isort (I) — both tools this repo used — and the
# formatter below replaces black, mirroring pyramids-core. The old flake8
# `select = "B,C,E,F,W,T4"` named B (bugbear) and T4, but those plugins were never
# installed, so the effective flake8 set was E/F/W; nothing is lost by dropping B/T4. UP
# (pyupgrade) is the one genuinely new rule group — there was no pyupgrade here before, so
# it adds capability rather than replacing a tool.
#
# The import-order contract (`import pyramids` first, so the vendored GDAL is on sys.path
# before any `from osgeo import ...`) is preserved: those lines carry `# isort:skip`,
# which ruff honours — verified, it leaves each one in place and only normalises blank
# lines within the remaining import groups.
select = ["E", "F", "W", "I", "UP"]
# Mirrors pyramids-core's ignore list (itself the old [tool.flake8].ignore). W503 is gone
# — ruff does not implement that formatter-owned pycodestyle code, so there is nothing to
# ignore; E226/E701 are added to match pyramids-core. C901 keeps complexity off, as the
# old `max-complexity` + ignored C901 effectively did.
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "C901", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# flake8 excluded tests/ and examples/ from linting; keep E/F/W and UP off there so the
# lint surface stays on shipped src/. Import-sorting (I) still applies everywhere.
"tests/**" = ["E", "F", "W", "UP"]
"examples/**" = ["E", "F", "W", "UP"]
# Notebooks legitimately import next to first use / after a setup cell, tripping E402.
"*.ipynb" = ["E402"]


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = false
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.coverage.run]
# Branch coverage, not just line coverage. The two differ exactly where the silent
# failures of this package live -- a connectivity re-basing or winding branch that is
# executed but never taken both ways reads as covered while being untested. Set here
# rather than as a task flag so every runner measures it: the pixi tasks, the
# pre-commit `pytest-check` hook and a bare `pytest` alike.
branch = true
source = ["src/pyramids_mesh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    # A test needing a vendor sample file rather than a hand-built fixture. Those
    # files are binary and large, so they are fetched in CI and never committed;
    # the default run deselects them with '-m \"not vendor_data\"'.
    "vendor_data: test needing a fetched vendor sample file"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
# The macOS baseline is raised on osx-arm64 so pixi picks the pre-built wheels
# instead of falling back to sdists. pyproj publishes only `macosx_14_0_arm64`
# for arm64, above the pixi default, so without this it has no wheel to take and
# builds from source — which needs PROJ headers the runner does not have. numpy
# and scipy also ship a `macosx_14_0_arm64` build and quietly drop to an older,
# lower-baseline wheel without it. macos-latest runners are >= 14.
#
# Declared here rather than in a `[tool.pixi.system-requirements]` table: pixi
# 0.73 deprecates that table in favour of virtual packages on the platform entry.
platforms = ["win-64", "linux-64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.pypi-dependencies]
pyramids-mesh = { path = ".", editable = true }
# The editable self-install is the only entry, and there is no
# [tool.pixi.dependencies] table at all: every environment is built from the
# standard declarations — runtime deps from [project.dependencies], tooling from
# the `dev` / `docs` dependency groups — all resolved from PyPI. A per-driver
# extra (`dhi`) is a PEP 621 `[project.optional-dependencies]` group; pixi maps
# each such group to a feature of the same name automatically, so an extra is
# pulled into an environment by listing its name in that environment's `features`
# (see the `dhi` environment) — never by re-declaring the dependency in a
# `[tool.pixi.feature.*]` table here. The lock carries an extra only for the
# environments that opt in, so it never holds a dependency nothing imports.
#
# In particular there is no conda `gdal`: the pyramids-core wheel vendors its own
# osgeo and `import pyramids` prepends that directory to `sys.path`, so a conda
# GDAL would be installed and never imported. A conda-forge feedstock build does
# need a real GDAL, but that belongs in the recipe, which takes its run
# requirements from [project.dependencies].

[tool.pixi.tasks]
# No `plot` task: this package declares no plotting code and no plotting
# dependency (ADR-0005). `main` therefore runs everything except the
# vendor-sample tests, whose files are fetched rather than committed.
main = { cmd = "pytest -vvv --cov=src/pyramids_mesh -sv -m 'not vendor_data' --cov-report=xml", description = "Run the main test suite" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids_mesh -sv --cov-report=xml --cov-report=term-missing", description = "Run the whole test suite" }
# dfsu.ipynb is ignored here: it can only read a DFSU file with mikeio, which lives only
# in the `dhi` environment. The `dhi` feature overrides this task (below) to run the full
# set including dfsu; the mikeio-less matrix envs (py311-py314, dev) run everything else.
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples --ignore=docs/examples/dfsu.ipynb", description = "check notebooks (excludes dfsu; see the dhi override)" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate the changelog with commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }

[tool.pixi.feature.dhi.tasks]
# The `dhi` environment is the only one carrying mikeio, so it is the only one that can
# execute `dfsu.ipynb`. Override `notebooks` here to run the full example set (including
# dfsu); the default `notebooks` task (above) ignores dfsu for the mikeio-less matrix
# environments. CI runs `pixi run -e dhi notebooks`, which resolves to this override.
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks (full set incl. DFSU, needs mikeio)" }

[tool.pixi.environments]
# The `notebook` feature (the PEP 735 `notebook` dependency-group: ipykernel + jupyter)
# is added to every environment that executes notebooks — `dev` for local
# `pixi run -e dev notebooks`, and the py311-py314 matrix envs CI runs the `notebooks`
# task in. ipykernel otherwise only arrived transitively via jupyterlab; this makes the
# notebook runtime an explicit, declared dependency of those envs. The minimal `default`
# runtime env and the `docs` env (which carries its own jupyter stack) are left without it.
default = { features = ["py314"], solve-group = "default" }
dev = { features = ["py314", "dev", "notebook"], solve-group = "default" }
docs = { features = ["py314", "docs"], solve-group = "default" }
py311 = { features = ["py311", "dev", "notebook"], solve-group = "py311" }
py312 = { features = ["py312", "dev", "notebook"], solve-group = "py312" }
py313 = { features = ["py313", "dev", "notebook"], solve-group = "py313" }
py314 = { features = ["py314", "dev", "notebook"], solve-group = "py314" }
# The `dhi` feature listed here is the PEP 621 `[project.optional-dependencies].dhi`
# extra (mikeio), which pixi exposes as a feature of the same name automatically; the
# dependency floor lives at that extra. The only `[tool.pixi.feature.dhi]` config is the
# `notebooks` task override above (so the dhi env runs the full example set incl. dfsu).
# Wired into its own environment now that the DFSU driver has landed. mikeio needs
# Python >= 3.12, so it cannot join the shared `dev` feature (the matrix includes
# py311); it gets a dedicated py314 environment with its own solve-group, so the heavy
# mikeio stack (mikecore, matplotlib, scipy, pandas) never perturbs the other
# environments' locks. CI adds `dhi` to the test matrix so the DFSU driver is exercised.
# It also carries the `notebook` feature: `dfsu.ipynb` can only read a DFSU file with
# mikeio installed, so this is the one environment that can execute that example.
dhi = { features = ["py314", "dev", "notebook", "dhi"], solve-group = "dhi" }


# Interpreter pins, one feature per environment in the matrix. `default`, `dev`
# and `docs` reuse `py314` rather than declaring a second 3.14 pin of their own.
# Nothing else constrains them — without a pin their only bound is
# `requires-python = ">= 3.11, <4"`, so they would float to whatever conda-forge
# ships newest. pyramids-core publishes cp311-cp314 wheels only, so once 3.15 is
# out an unpinned re-lock would resolve an interpreter with no wheel and fall
# back to the sdist, which vendors no osgeo — and with no conda GDAL underneath,
# that is a hard import failure. Bump the pin when pyramids ships 3.15 wheels.
# (CI installs from the lock file, so a released 3.15 breaks nothing until
# someone re-locks.)
#
# 3.13 and 3.14 additionally carry a build glob to exclude the free-threaded
# interpreter, whose conda build string ends `_cp313t` / `_cp314t` — the glob
# anchors on the plain suffix, so it matches one and not the other. pyramids
# skips `cp313t` / `cp314t` in cibuildwheel and ships no wheel for either, and
# nothing absorbs that: `pixi lock` and `pixi install` both still succeed in
# that state, so the failure lands at import rather than at resolve time.
#
# 3.11 and 3.12 need no glob — free-threading starts at 3.13, so conda-forge
# publishes no `t` variant to exclude.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }
[tool.pixi.feature.py314.dependencies]
python = { version = "3.14.*", build = "*_cp314" }
