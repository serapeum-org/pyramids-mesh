[project]
name = "pyramids-mesh"
version = "0.0.0"
description = "Mesh file-format drivers for pyramids: 2DM, Selafin, DFSU, XMDF, PLY and more"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "mesh", "UGRID", "unstructured grid", "pyramids"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is deliberately absent. It is not a dependency of this package: the
# `pyramids-gis` wheel vendors its own osgeo bindings and `import pyramids` is
# what puts them on `sys.path` (activate_vendored_osgeo). Nothing here installs
# or pins a separate GDAL.
dependencies = [
    "pyramids-gis >=0.69.0",
    "numpy >=2.0.0",
]
# scipy, shapely and geopandas are deliberately NOT declared yet. The UGRID
# subsystem requires all three, so they arrive with `pyramids-gis` — but that is
# its requirement, not a promise to this package. Declare each one here the
# moment a module under `src/pyramids_mesh/` imports it directly; inheriting a
# peer's transitive dependency is what breaks when that peer reshuffles its own
# requirements.

[project.optional-dependencies]
# No `viz` extra. A driver returns data and the caller plots it, through pyramids
# and cleopatra — this package declares no plotting code and therefore no plotting
# dependency (ADR-0005).
#
# One extra per dependency-backed driver family. A driver whose extra is absent
# cannot import its backing library at driver-module import, so pyramids' registry
# skips it with a warning — a bare install stays small and every other driver keeps
# working.

# DHI MIKE: DFSU (unstructured) and DFS2 (structured grid). These proprietary binary
# containers cannot be parsed without DHI's own library; mikeio is the only portable
# route. It is the heaviest extra here: it pulls mikecore, pandas, matplotlib, scipy
# and tqdm.
dhi = ["mikeio >=3.0.0"]

all = ["pyramids-mesh[dhi]"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0",
    # Same versions the pre-commit hooks pin, so `pixi run -e dev python -m black`,
    # `-m flake8` and `-m pydocstyle` match what CI and the hooks enforce.
    #
    # black must stay >= 26.3.1: 24.10.0 (which digital-rivers still pins, and
    # this file inherited) carries PYSEC-2026-2120 and PYSEC-2026-2121, so
    # `pip-audit.yml` fails on the py311 resolution. Keep this pin and the
    # `.pre-commit-config.yaml` rev in step.
    "black==26.10.1",
    "flake8==7.1.1",
    "Flake8-pyproject>=1.2.3",
    "pydocstyle==6.3.0"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


# One entry point per driver. The value is a class, which pyramids' registry
# instantiates with no arguments; a class rather than a function because `can_open`
# matters -- several of these formats share `.dat`, `.mesh` and `.out`, so a suffix
# alone cannot identify one. A driver whose optional extra is missing raises at
# driver-module import and the registry skips it with a warning, which is why a bare
# install stays useful.
[project.entry-points."pyramids.mesh_drivers"]
2dm = "pyramids_mesh.drivers.sms:TwoDmDriver"
dat = "pyramids_mesh.drivers.sms:DatDriver"
mike21 = "pyramids_mesh.drivers.misc:Mike21Driver"
selafin = "pyramids_mesh.drivers.telemac:SelafinDriver"
sww = "pyramids_mesh.drivers.anuga:SwwDriver"
ply = "pyramids_mesh.drivers.interchange:PlyDriver"
xmstin = "pyramids_mesh.drivers.interchange:XmsTinDriver"
xmdf = "pyramids_mesh.drivers.xmdf:XmdfDriver"
3di = "pyramids_mesh.drivers.threedi:ThreeDiDriver"
tuflowfv = "pyramids_mesh.drivers.tuflowfv:TuflowFvDriver"
dfsu = "pyramids_mesh.drivers.dhi:DfsuDriver"
esri_tin = "pyramids_mesh.drivers.esri:EsriTinDriver"


[project.urls]
homepage = "https://github.com/serapeum-org/pyramids-mesh"
repository = "https://github.com/serapeum-org/pyramids-mesh"
documentation = "https://serapeum-org.github.io/pyramids-mesh"
Changelog = "https://github.com/serapeum-org/pyramids-mesh/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids_mesh", "pyramids_mesh.*"]
# Belt and braces: `where = ["src"]` already means `tests/` cannot be picked up as a
# package, so this only states the intent for anyone reading the wheel contents.
exclude = ["tests*"]

# No sdist configuration here, and not for want of trying: setuptools offers no
# pyproject.toml equivalent of MANIFEST.in's `prune`, so sdist contents cannot be
# steered from this file. The default sdist carries `tests/*.py` and, importantly, does
# NOT carry `tests/data/*` -- so the binary format fixtures the PyPI-quota argument in
# ADR-0005 is about stay out of the distribution on their own. A handful of small test
# modules riding along costs nothing, so there is no MANIFEST.in.


[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
# No `profile` key: black does not have one (that is an isort concept) and warns
# "Invalid config keys detected: 'profile'" on every run when it is present.
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = false
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.coverage.run]
# Branch coverage, not just line coverage. The two differ exactly where the silent
# failures of this package live -- a connectivity re-basing or winding branch that is
# executed but never taken both ways reads as covered while being untested. Set here
# rather than as a task flag so every runner measures it: the pixi tasks, the
# pre-commit `pytest-check` hook and a bare `pytest` alike.
branch = true
source = ["src/pyramids_mesh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    # A test needing a vendor sample file rather than a hand-built fixture. Those
    # files are binary and large, so they are fetched in CI and never committed;
    # the default run deselects them with '-m \"not vendor_data\"'.
    "vendor_data: test needing a fetched vendor sample file"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
# The macOS baseline is raised on osx-arm64 so pixi picks the pre-built wheels
# instead of falling back to sdists. pyproj publishes only `macosx_14_0_arm64`
# for arm64, above the pixi default, so without this it has no wheel to take and
# builds from source — which needs PROJ headers the runner does not have. numpy
# and scipy also ship a `macosx_14_0_arm64` build and quietly drop to an older,
# lower-baseline wheel without it. macos-latest runners are >= 14.
#
# Declared here rather than in a `[tool.pixi.system-requirements]` table: pixi
# 0.73 deprecates that table in favour of virtual packages on the platform entry.
platforms = ["win-64", "linux-64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.pypi-dependencies]
pyramids-mesh = { path = ".", editable = true }
# The editable self-install is the only entry, and there is no
# [tool.pixi.dependencies] table at all: every environment is built from the
# standard declarations — runtime deps from [project.dependencies], tooling from
# the `dev` / `docs` dependency groups — all resolved from PyPI. The per-driver
# extra (`dhi`) is declared for pip users and is
# deliberately in no pixi environment yet: each is wired into one when the driver
# that needs it lands, so the lock never carries a dependency nothing imports.
#
# In particular there is no conda `gdal`: the pyramids-gis wheel vendors its own
# osgeo and `import pyramids` prepends that directory to `sys.path`, so a conda
# GDAL would be installed and never imported. A conda-forge feedstock build does
# need a real GDAL, but that belongs in the recipe, which takes its run
# requirements from [project.dependencies].

[tool.pixi.tasks]
# No `plot` task: this package declares no plotting code and no plotting
# dependency (ADR-0005). `main` therefore runs everything except the
# vendor-sample tests, whose files are fetched rather than committed.
main = { cmd = "pytest -vvv --cov=src/pyramids_mesh -sv -m 'not vendor_data' --cov-report=xml", description = "Run the main test suite" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids_mesh -sv --cov-report=xml --cov-report=term-missing", description = "Run the whole test suite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate the changelog with commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }

[tool.pixi.environments]
default = { features = ["py314"], solve-group = "default" }
dev = { features = ["py314", "dev"], solve-group = "default" }
docs = { features = ["py314", "docs"], solve-group = "default" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }
py314 = { features = ["py314", "dev"], solve-group = "py314" }


# Interpreter pins, one feature per environment in the matrix. `default`, `dev`
# and `docs` reuse `py314` rather than declaring a second 3.14 pin of their own.
# Nothing else constrains them — without a pin their only bound is
# `requires-python = ">= 3.11, <4"`, so they would float to whatever conda-forge
# ships newest. pyramids-gis publishes cp311-cp314 wheels only, so once 3.15 is
# out an unpinned re-lock would resolve an interpreter with no wheel and fall
# back to the sdist, which vendors no osgeo — and with no conda GDAL underneath,
# that is a hard import failure. Bump the pin when pyramids ships 3.15 wheels.
# (CI installs from the lock file, so a released 3.15 breaks nothing until
# someone re-locks.)
#
# 3.13 and 3.14 additionally carry a build glob to exclude the free-threaded
# interpreter, whose conda build string ends `_cp313t` / `_cp314t` — the glob
# anchors on the plain suffix, so it matches one and not the other. pyramids
# skips `cp313t` / `cp314t` in cibuildwheel and ships no wheel for either, and
# nothing absorbs that: `pixi lock` and `pixi install` both still succeed in
# that state, so the failure lands at import rather than at resolve time.
#
# 3.11 and 3.12 need no glob — free-threading starts at 3.13, so conda-forge
# publishes no `t` variant to exclude.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }
[tool.pixi.feature.py314.dependencies]
python = { version = "3.14.*", build = "*_cp314" }
